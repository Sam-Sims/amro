[package]
name = "amro"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
memchr = "2.8.0"
sirocco = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
strum = { version = "0.28.0", features = ["derive"] }
fearless_simd = "1.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
rusty-s3 = "0.10.2"
shlex = "2.0.1"
tabled = "0.22.0"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.3"
rstest = "0.28"
tempfile = "3.10"

[[bench]]
name = "throughput"
harness = false

[profile.release]
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
inline_always = "allow"
